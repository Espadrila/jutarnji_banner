.jxnyt,.jxnyt *{box-sizing:border-box;margin:0;padding:0}
.jxnyt{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#000;color:#fff;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* iOS Safari inače sam poveća tekst */
.jxnyt .jx-shape{position:absolute;inset:0;width:100%;height:100%}
.jxnyt .jx-mrlja{position:absolute;display:block}
.jxnyt .jx-bf,.jxnyt .jx-copy{position:absolute;inset:0}
.jxnyt .jx-bf>p{position:absolute;width:1000px;text-align:center;white-space:nowrap;font-family:"JX Archivo XI","Arial Black",sans-serif;font-weight:900;font-style:italic;line-height:1;text-transform:uppercase}
.jxnyt .jx-copy p{position:absolute;white-space:nowrap}
.jxnyt .jx-tbox{overflow:hidden}
.jxnyt .jx-tbox>span{display:block;font-family:"JX Archivo XC","Arial Narrow",sans-serif;font-weight:700;line-height:1.15;letter-spacing:0}
.jxnyt .jx-ln{font-family:"JX Slabo",Georgia,serif;font-weight:400}
.jxnyt .jx-ln s{color:#b4b4b4;text-decoration:line-through;text-decoration-color:#b4b4b4}
.jxnyt .jx-cta{position:absolute;display:block}
.jxnyt .jx-txt,.jxnyt .jx-lg{position:absolute;inset:0}
.jxnyt .jx-lg{opacity:0}
.jxnyt .jx-tbox>span>span{display:block}
.jxnyt .jx-lgbox{position:absolute;overflow:hidden}
.jxnyt .jx-lgbox>svg,.jxnyt .jx-lgn{position:absolute;display:block}
/* uvod */
.jxnyt .jx-shape{animation:jx-shape .7s cubic-bezier(.2,.8,.2,1) both}
.jxnyt .jx-mrlja{animation:jx-fade .7s ease-out .1s both}
.jxnyt .jx-bf{animation:jx-fade .6s ease-out .35s both}
.jxnyt .jx-copy{animation:jx-in .55s cubic-bezier(.2,.8,.3,1) .5s both}
.jxnyt .jx-tbox>span{animation:jx-tin .55s cubic-bezier(.2,.8,.3,1) .55s both}
.jxnyt .jx-txt{animation:jx-txt 15s linear 11s 6 both}
.jxnyt .jx-tbox>span>span{animation:jx-txtr 15s linear 11s 6 both}
.jxnyt .jx-lg{animation:jx-lg 15s linear 11s 6 both}
.jxnyt .jx-lgbox>svg{animation:jx-lgr 15s linear 11s 6 both}
.jxnyt .jx-cta{animation:jx-pop .45s cubic-bezier(.34,1.56,.64,1) .55s both,jx-ctapop 15.00s linear 16.00s 6 forwards}
@keyframes jx-shape{0%{transform:translate(35%,35%)}100%{transform:none}}
@keyframes jx-phone{0%{transform:translateY(35%);opacity:0}100%{transform:none;opacity:1}}
@keyframes jx-fade{0%{opacity:0}100%{opacity:1}}
@keyframes jx-pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes jx-in{0%{transform:translateX(16px);opacity:0}100%{transform:none;opacity:1}}
@keyframes jx-tin{0%{transform:translateY(110%)}100%{transform:none}}
@keyframes jx-ctapop{0.000%{transform:scale(1);animation-timing-function:linear}0.667%{transform:scale(1);animation-timing-function:cubic-bezier(.3,0,.4,1)}2.000%{transform:scale(1.07);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}4.333%{transform:scale(1);animation-timing-function:linear}100.000%{transform:scale(1);animation-timing-function:linear}}@keyframes jx-txt{0%{opacity:1;transform:none}2.333%{opacity:0;transform:none}26.667%{opacity:0;transform:translateX(16px);animation-timing-function:cubic-bezier(.2,.8,.3,1)}30.333%{opacity:1;transform:none}100%{opacity:1;transform:none}}@keyframes jx-txtr{0%{transform:none}2.333%{transform:none}2.400%{transform:translateY(110%)}27.000%{transform:translateY(110%);animation-timing-function:cubic-bezier(.2,.8,.3,1)}30.667%{transform:none}100%{transform:none}}@keyframes jx-lg{0%{opacity:0;transform:translateX(16px)}2.000%{opacity:0;transform:translateX(16px);animation-timing-function:cubic-bezier(.2,.8,.3,1)}5.667%{opacity:1;transform:none}24.333%{opacity:1;transform:none}26.667%{opacity:0;transform:none}100%{opacity:0;transform:translateX(16px)}}@keyframes jx-lgr{0%{transform:translateY(110%)}2.333%{transform:translateY(110%);animation-timing-function:cubic-bezier(.2,.8,.3,1)}6.000%{transform:none}26.667%{transform:none}26.733%{transform:translateY(110%)}100%{transform:translateY(110%)}}
@media (prefers-reduced-motion:reduce){.jxnyt *{animation:none!important}}
