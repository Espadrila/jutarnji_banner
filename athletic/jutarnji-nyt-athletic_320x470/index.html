.jxnyt,.jxnyt *{box-sizing:border-box;margin:0;padding:0}
.jxnyt{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#f7f7f7;color:#000;-webkit-font-smoothing:antialiased}
.jxnyt .jx-shape{position:absolute;inset:0;width:100%;height:100%;fill:#000}
.jxnyt .jx-a>*{position:absolute;display:block;height:auto}
.jxnyt .jx-phone{position:absolute}
.jxnyt .jx-screen{position:absolute;overflow:hidden;background:#fff}
.jxnyt .jx-strip{position:absolute;inset:0}
.jxnyt .jx-strip>i{position:absolute;top:0;width:100%;height:100%;background-repeat:no-repeat;background-size:100% auto;background-position:0 0}
.jxnyt .jx-frame{position:absolute;left:0;top:0;width:100%;height:auto;display:block}
.jxnyt .jx-copy{position:absolute;color:#fff}
.jxnyt .jx-sub{font-family:"JX Slabo",Georgia,serif;font-weight:400;font-size:var(--fs);line-height:var(--ls)}
.jxnyt .jx-l2{position:relative;height:calc(var(--ls) * var(--l2n))}
.jxnyt .jx-l2>span{position:absolute;left:0;right:0;top:0;white-space:nowrap}
.jxnyt .jx-tbox{position:relative;overflow:hidden;height:calc(var(--ft) * var(--tn));margin-top:var(--gap)}
.jxnyt .jx-tbox>span{position:absolute;left:0;right:0;bottom:0;font-family:"JX Archivo XC","Arial Narrow",sans-serif;font-weight:700;font-size:var(--ft);line-height:1;letter-spacing:-.005em;text-wrap:balance;padding-bottom:.06em}
/* base (static) state = Jutarnji frame */
.jxnyt .jx-tbox>span{transform:translateY(110%);opacity:0}
.jxnyt .jx-tbox>.t-jut{transform:none;opacity:1}
.jxnyt .jx-l2>.s-b{opacity:0}
.jxnyt .jx-l2 .w{display:inline-block;font-weight:400;transform-origin:50% 85%;margin:0 .04em}

/* intro */
.jxnyt .jx-shape{animation:jx-shape .7s cubic-bezier(.2,.8,.2,1) both}
.jxnyt .jx-phone{animation:jx-phone .8s cubic-bezier(.2,.8,.25,1) .15s both}
.jxnyt .jx-a>:nth-child(1){animation:jx-up .5s cubic-bezier(.2,.8,.3,1) .3s both}
.jxnyt .jx-a>:nth-child(2){animation:jx-up .5s cubic-bezier(.2,.8,.3,1) .4s both}
.jxnyt .jx-a>:nth-child(3){animation:jx-pop .45s cubic-bezier(.34,1.56,.64,1) .55s both}
.jxnyt .jx-copy{animation:jx-in .55s cubic-bezier(.2,.8,.3,1) .5s both}
@keyframes jx-shape{0%{transform:translate(35%,35%)}100%{transform:none}}
@keyframes jx-phone{0%{transform:translateY(35%);opacity:0}100%{transform:none;opacity:1}}
@keyframes jx-up{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes jx-pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes jx-in{0%{transform:translateX(16px);opacity:0}100%{transform:none;opacity:1}}
